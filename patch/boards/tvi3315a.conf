# Rockchip RK3399 hexa core 4GB RAM SoC WIFI/BT eMMC USB2/3
BOARD_NAME="RK-Tvi3315a"
BOARDFAMILY="rockchip64"
BOARD_MAINTAINER=""
INTRODUCED="2017"
BOOTCONFIG="orangepi-rk3399_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3399-tvi3315a.dtb"
IMAGE_PARTITION_TABLE="gpt"

function post_family_tweaks__tvi3315a_naming_lan() {
	display_alert "$BOARD" "Renaming tvi3315a lan" "info"

	mkdir -p "${SDCARD}"/etc/udev/rules.d/
	echo 'SUBSYSTEM=="net", ACTION=="add", DRIVERS=="?*", KERNEL=="end*", NAME="eth0"' > $SDCARD/etc/udev/rules.d/97-rename-lan.rules

	return 0
}
